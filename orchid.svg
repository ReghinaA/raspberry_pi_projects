<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 420 520" width="420" height="520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="petal" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FBD3EA"/>
      <stop offset="100%" stop-color="#F2A6D2"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6DBB5C"/>
      <stop offset="100%" stop-color="#3E8A3A"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8EC9E8"/>
      <stop offset="100%" stop-color="#5AA6D0"/>
    </linearGradient>
    <g id="flower">
      <!-- dorsal sepal -->
      <ellipse cx="0" cy="-17" rx="11" ry="18" fill="url(#petal)" stroke="#E07BB8" stroke-width="1.2"/>
      <!-- lateral sepals -->
      <ellipse cx="-12" cy="14" rx="10" ry="17" transform="rotate(35 -12 14)" fill="url(#petal)" stroke="#E07BB8" stroke-width="1.2"/>
      <ellipse cx="12" cy="14" rx="10" ry="17" transform="rotate(-35 12 14)" fill="url(#petal)" stroke="#E07BB8" stroke-width="1.2"/>
      <!-- big side petals -->
      <ellipse cx="-19" cy="-2" rx="19" ry="16" transform="rotate(-10 -19 -2)" fill="url(#petal)" stroke="#E07BB8" stroke-width="1.2"/>
      <ellipse cx="19" cy="-2" rx="19" ry="16" transform="rotate(10 19 -2)" fill="url(#petal)" stroke="#E07BB8" stroke-width="1.2"/>
      <!-- lip -->
      <path d="M -7 4 Q 0 -2 7 4 Q 9 14 0 18 Q -9 14 -7 4 Z" fill="#C2185B"/>
      <path d="M -3 16 Q -6 22 -9 21 M 3 16 Q 6 22 9 21" stroke="#C2185B" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- column -->
      <ellipse cx="0" cy="1" rx="3.5" ry="4.5" fill="#FFE27A" stroke="#E0A800" stroke-width="0.8"/>
    </g>
  </defs>

  <!-- soft background -->
  <circle cx="210" cy="250" r="200" fill="#F4FAF1"/>
  <circle cx="330" cy="90" r="4" fill="#F7B6D8"/>
  <circle cx="80" cy="130" r="3" fill="#F7B6D8"/>
  <circle cx="360" cy="220" r="3" fill="#BFE3B4"/>

  <!-- flower spike -->
  <path d="M 200 350 C 190 260 205 170 250 120 C 285 85 345 78 378 122" stroke="#5E8C3A" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- stake -->
  <line x1="205" y1="352" x2="208" y2="170" stroke="#B08A5A" stroke-width="3" stroke-linecap="round"/>
  <!-- clip -->
  <rect x="200" y="210" width="12" height="6" rx="2" fill="#9CCC65"/>

  <!-- buds -->
  <ellipse cx="379" cy="128" rx="7" ry="9" fill="#F9C6E2" stroke="#E07BB8" stroke-width="1"/>
  <ellipse cx="364" cy="104" rx="6" ry="8" transform="rotate(-30 364 104)" fill="#CFE8B8" stroke="#6DAA4F" stroke-width="1"/>

  <!-- flowers along the arch -->
  <use xlink:href="#flower" transform="translate(206 196) scale(1.1)"/>
  <use xlink:href="#flower" transform="translate(262 130) scale(1.05)"/>
  <use xlink:href="#flower" transform="translate(320 98) scale(0.95)"/>

  <!-- aerial roots -->
  <path d="M 165 352 C 150 360 140 372 136 388" stroke="#B7C9A8" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 250 350 C 268 356 276 368 280 384" stroke="#B7C9A8" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- leaves -->
  <path d="M 205 352 C 150 340 95 330 70 300 C 110 300 170 318 210 345 Z" fill="url(#leaf)"/>
  <path d="M 205 352 C 260 338 320 330 350 296 C 305 298 245 318 202 345 Z" fill="url(#leaf)"/>
  <path d="M 205 352 C 175 325 150 300 150 268 C 180 285 200 320 212 348 Z" fill="#5AAE4C"/>
  <path d="M 205 352 C 238 326 262 305 270 275 C 240 290 215 320 200 348 Z" fill="#4E9E43"/>

  <!-- pot -->
  <path d="M 130 350 L 290 350 L 272 470 Q 270 482 258 482 L 162 482 Q 150 482 148 470 Z" fill="url(#pot)"/>
  <rect x="122" y="342" width="176" height="22" rx="8" fill="#7BBDE0"/>
  <!-- bark on top -->
  <circle cx="150" cy="344" r="5" fill="#A0714F"/><circle cx="175" cy="341" r="5" fill="#8B5E3C"/>
  <circle cx="245" cy="342" r="5" fill="#8B5E3C"/><circle cx="270" cy="344" r="5" fill="#A0714F"/>
  <!-- cute face -->
  <circle cx="190" cy="410" r="6" fill="#2D3A4A"/>
  <circle cx="230" cy="410" r="6" fill="#2D3A4A"/>
  <circle cx="192" cy="408" r="2" fill="#FFFFFF"/>
  <circle cx="232" cy="408" r="2" fill="#FFFFFF"/>
  <path d="M 198 426 Q 210 438 222 426" stroke="#2D3A4A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="176" cy="428" rx="9" ry="5" fill="#F7A8C8" opacity="0.8"/>
  <ellipse cx="244" cy="428" rx="9" ry="5" fill="#F7A8C8" opacity="0.8"/>

  <!-- tiny sensor on a stick (smart greenhouse wink) -->
  <line x1="120" y1="346" x2="112" y2="300" stroke="#888" stroke-width="2"/>
  <rect x="100" y="286" width="24" height="16" rx="3" fill="#2E2E3A"/>
  <circle cx="112" cy="294" r="3" fill="#7CFC9A"/>
</svg>
